name: Windows build and regression

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.402'
      - name: Build, test and publish
        shell: pwsh
        run: ./build.ps1 -Test -Publish -OutputDirectory release-next
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify recorded research provenance without inference
        shell: pwsh
        run: |
          python research/gliner/verify_public.py
          if ($LASTEXITCODE -ne 0) { throw 'Research source, raw-output or review binding differs.' }
      - name: Build explicit GPU validation tool without starting workloads
        shell: pwsh
        run: |
          dotnet build tools/GpuWorkloadCheck/GpuWorkloadCheck.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'GPU validation tool did not build.' }
          dotnet tools/GpuWorkloadCheck/bin/Release/net10.0/GpuWorkloadCheck.dll
          if ($LASTEXITCODE -ne 2) { throw 'The tool must require explicit executable paths and an isolated output directory.' }
          $global:LASTEXITCODE = 0
      - name: Regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-results
          path: |
            artifacts/self-tests.txt
            artifacts/quantity-cases.txt
            artifacts/history-read-benchmark.json
      - name: Model batch transport regression
        shell: pwsh
        run: ./tests/model-probe-batch.ps1
      - name: Validation process supervision
        shell: pwsh
        run: |
          ./tests/validation-supervision-tests.ps1 -SourceDirectory release-next
          if ($LASTEXITCODE -ne 0) { throw 'Validation supervision regression failed.' }
          $latest = Get-Content 'artifacts/validation-supervision-test-latest.json' -Raw | ConvertFrom-Json
          $summary = Get-Content (Join-Path $latest.RunDirectory 'summary.json') -Raw | ConvertFrom-Json
          if ($summary.Failed -ne 0 -or $summary.Passed -ne 27) { throw 'Validation supervision checks are incomplete.' }
      - name: Validation supervision evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-supervision
          path: artifacts/validation-supervision-test-*/evidence/
      - name: Native sampling during a stalled UI
        shell: pwsh
        run: |
          $root = Join-Path $PWD 'artifacts/ci-sampling-isolation/data'
          $p = Start-Process ./release-next/PerfCompass.exe -ArgumentList @('--ui-test','--ui-test-sampling-isolation-only','--data-dir',('"' + $root + '"')) -PassThru -WindowStyle Hidden
          $handle = $p.Handle
          if (-not $p.WaitForExit(120000)) { throw ('Sampling isolation observation expired; inspect PID ' + $p.Id) }
          $p.WaitForExit(); $p.Refresh()
          if ($p.ExitCode -ne 0) { throw 'Native sampling isolation flow failed.' }
          $checks = Get-Content 'artifacts/ui-sampling-isolation-focused/results.txt'
          if (@($checks | Where-Object { $_ -like 'PASS *' }).Count -ne 21 -or @($checks | Where-Object { $_ -like 'FAIL *' }).Count -gt 0) { throw 'Sampling isolation checks are incomplete.' }
      - name: Native sampling isolation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-sampling-isolation
          path: artifacts/ui-sampling-isolation-focused/
      - name: Native CPU counter recovery flow
        shell: pwsh
        run: |
          $root = Join-Path $PWD 'artifacts/ci-cpu-ui/data'
          $p = Start-Process ./release-next/PerfCompass.exe -ArgumentList @('--ui-test','--ui-test-cpu-only','--data-dir',('"' + $root + '"')) -PassThru -WindowStyle Hidden
          if (-not $p.WaitForExit(75000)) { $p.Kill(); throw 'Native CPU recovery flow exceeded its bounded check.' }
          if ($p.ExitCode -ne 0) { throw 'Native CPU recovery flow failed.' }
          $report = Join-Path $PWD 'artifacts/ui-cpu-focused/results.txt'
          if (-not (Test-Path -LiteralPath $report)) { throw 'Native CPU recovery results are missing.' }
          $checks = Get-Content -LiteralPath $report
          if (@($checks | Where-Object { $_ -like 'PASS *' }).Count -ne 6 -or @($checks | Where-Object { $_ -like 'FAIL *' }).Count -gt 0) { throw 'Native CPU recovery checks are incomplete.' }
      - name: Native CPU recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-cpu-recovery
          path: artifacts/ui-cpu-focused/
      - name: Native GPU engine scope flow
        shell: pwsh
        run: |
          $root = Join-Path $PWD 'artifacts/ci-gpu-ui/data'
          $p = Start-Process ./release-next/PerfCompass.exe -ArgumentList @('--ui-test','--ui-test-gpu-only','--data-dir',('"' + $root + '"')) -PassThru -WindowStyle Hidden
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw 'Native GPU engine flow exceeded its bounded check.' }
          if ($p.ExitCode -ne 0) { throw 'Native GPU engine flow failed.' }
          $report = Join-Path $PWD 'artifacts/ui-gpu-focused/results.txt'
          if (-not (Test-Path -LiteralPath $report)) { throw 'Native GPU engine results are missing.' }
          $checks = Get-Content -LiteralPath $report
          if (@($checks | Where-Object { $_ -like 'PASS *' }).Count -ne 12 -or @($checks | Where-Object { $_ -like 'FAIL *' }).Count -gt 0) { throw 'Native GPU engine checks are incomplete.' }
      - name: Native GPU engine evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-gpu-engine-scope
          path: artifacts/ui-gpu-focused/
      - name: Native preliminary observation and single-candidate flow
        shell: pwsh
        run: |
          $root = Join-Path $PWD 'artifacts/ci-observation-ui/data'
          $p = Start-Process ./release-next/PerfCompass.exe -ArgumentList @('--ui-test','--ui-test-observation-only','--data-dir',('"' + $root + '"')) -PassThru -WindowStyle Hidden
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw 'Native observation flow exceeded its bounded check.' }
          if ($p.ExitCode -ne 0) { throw 'Native observation flow failed.' }
          $report = Join-Path $PWD 'artifacts/ui-observation-focused/results.txt'
          if (-not (Test-Path -LiteralPath $report)) { throw 'Native observation results are missing.' }
          $checks = Get-Content -LiteralPath $report
          if (@($checks | Where-Object { $_ -like 'PASS *' }).Count -ne 66 -or @($checks | Where-Object { $_ -like 'FAIL *' }).Count -gt 0) { throw 'Native observation checks are incomplete.' }
      - name: Native preliminary observation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-preliminary-observation
          path: artifacts/ui-observation-focused/
      # CI uses recorded public source facts; live shop reads are explicit local checks.
      - name: Native product-page import and candidate triage
        shell: pwsh
        run: |
          $root = Join-Path $PWD 'artifacts/ci-product-page/data'
          $p = Start-Process ./release-next/PerfCompass.exe -ArgumentList @('--ui-test','--ui-test-product-page-only','--data-dir',('"' + $root + '"')) -PassThru -WindowStyle Hidden
          $handle = $p.Handle
          if (-not $p.WaitForExit(90000)) { throw ('Product-page observation expired; inspect PID ' + $p.Id) }
          $p.WaitForExit(); $p.Refresh()
          if ($p.ExitCode -ne 0) { throw 'Native product-page flow failed.' }
          $checks = Get-Content artifacts/ui-product-page-focused/results.txt
          if (@($checks | Where-Object { $_ -like 'PASS *' }).Count -ne 20 -or @($checks | Where-Object { $_ -like 'FAIL *' }).Count -gt 0) { throw 'Product-page checks are incomplete.' }
      - name: Product-page entry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-product-page
          path: artifacts/ui-product-page-focused/
      - name: Native hourly history weighting flow
        shell: pwsh
        run: |
          $root = Join-Path $PWD 'artifacts/ci-hourly-ui/data'
          $p = Start-Process ./release-next/PerfCompass.exe -ArgumentList @('--ui-test','--ui-test-history-aggregation-only','--data-dir',('"' + $root + '"')) -PassThru -WindowStyle Hidden
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw 'Native hourly history flow exceeded its bounded check.' }
          if ($p.ExitCode -ne 0) { throw 'Native hourly history flow failed.' }
          $report = Join-Path $PWD 'artifacts/ui-history-aggregation-focused/results.txt'
          if (-not (Test-Path -LiteralPath $report)) { throw 'Native hourly history results are missing.' }
          $checks = Get-Content -LiteralPath $report
          if (@($checks | Where-Object { $_ -like 'PASS *' }).Count -ne 12 -or @($checks | Where-Object { $_ -like 'FAIL *' }).Count -gt 0) { throw 'Native hourly history checks are incomplete.' }
      - name: Native hourly history evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-hourly-history
          path: artifacts/ui-history-aggregation-focused/
      - name: Native portable task plan and result recovery flow
        shell: pwsh
        run: |
          $root = Join-Path $PWD 'artifacts/ci-task-plan-ui/data'
          $p = Start-Process ./release-next/PerfCompass.exe -ArgumentList @('--ui-test','--ui-test-task-plan-only','--data-dir',('"' + $root + '"')) -PassThru -WindowStyle Hidden
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw 'Native task plan flow exceeded its bounded check.' }
          if ($p.ExitCode -ne 0) { throw 'Native task plan flow failed.' }
          $report = Join-Path $PWD 'artifacts/ui-task-plan-focused/results.txt'
          if (-not (Test-Path -LiteralPath $report)) { throw 'Native task plan results are missing.' }
          $checks = Get-Content -LiteralPath $report
          if (@($checks | Where-Object { $_ -like 'PASS *' }).Count -ne 30 -or @($checks | Where-Object { $_ -like 'FAIL *' }).Count -gt 0) { throw 'Native task plan checks are incomplete.' }
      - name: Native task plan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-task-plan
          path: artifacts/ui-task-plan-focused/
      - name: Native task file protection and legacy method flow
        shell: pwsh
        run: |
          $root = Join-Path $PWD 'artifacts/ci-file-protection/data'
          $p = Start-Process ./release-next/PerfCompass.exe -ArgumentList @('--ui-test','--ui-test-file-protection-only','--data-dir',('"' + $root + '"')) -PassThru -WindowStyle Hidden
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw 'Native file protection flow exceeded its bounded check.' }
          if ($p.ExitCode -ne 0) { throw 'Native file protection flow failed.' }
          $checks = Get-Content artifacts/ui-file-protection-focused/results.txt
          if (@($checks | Where-Object { $_ -like 'PASS *' }).Count -ne 28 -or @($checks | Where-Object { $_ -like 'FAIL *' }).Count -gt 0) { throw 'Native file protection checks are incomplete.' }
      - name: Native task file protection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-file-protection
          path: artifacts/ui-file-protection-focused/
      - name: Native unresolved alternative comparison flow
        shell: pwsh
        run: |
          $root = Join-Path $PWD 'artifacts/ci-uncertainty/data'
          $p = Start-Process ./release-next/PerfCompass.exe -ArgumentList @('--ui-test','--ui-test-uncertainty-only','--data-dir',('"' + $root + '"')) -PassThru -WindowStyle Hidden
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw 'Native uncertainty flow exceeded its bounded check.' }
          if ($p.ExitCode -ne 0) { throw 'Native uncertainty flow failed.' }
          $checks = Get-Content artifacts/ui-uncertainty-focused/results.txt
          if (@($checks | Where-Object { $_ -like 'PASS *' }).Count -ne 21 -or @($checks | Where-Object { $_ -like 'FAIL *' }).Count -gt 0) { throw 'Native uncertainty checks are incomplete.' }
      - name: Native unresolved alternative evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-uncertainty
          path: artifacts/ui-uncertainty-focused/
      - name: Native semantic purchasing use flow
        shell: pwsh
        run: |
          $root = Join-Path $PWD 'artifacts/ci-semantic-use/data'
          $p = Start-Process ./release-next/PerfCompass.exe -ArgumentList @('--ui-test','--ui-test-semantic-use-only','--data-dir',('"' + $root + '"')) -PassThru -WindowStyle Hidden
          if (-not $p.WaitForExit(90000)) { throw ('Native semantic use observation expired; inspect PID ' + $p.Id) }
          if ($p.ExitCode -ne 0) { throw 'Native semantic use flow failed.' }
          $checks = Get-Content artifacts/ui-semantic-use-focused/results.txt
          if (@($checks | Where-Object { $_ -like 'PASS *' }).Count -ne 25 -or @($checks | Where-Object { $_ -like 'FAIL *' }).Count -gt 0) { throw 'Native semantic use checks are incomplete.' }
      - name: Native semantic use evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-semantic-use
          path: artifacts/ui-semantic-use-focused/
      - name: Native experience record integrity flow
        shell: pwsh
        run: |
          $root = Join-Path $PWD 'artifacts/ci-experience-integrity/data'
          $p = Start-Process ./release-next/PerfCompass.exe -ArgumentList @('--ui-test','--ui-test-experience-integrity-only','--data-dir',('"' + $root + '"')) -PassThru -WindowStyle Hidden
          if (-not $p.WaitForExit(90000)) { throw ('Native experience integrity observation expired; inspect PID ' + $p.Id) }
          if ($p.ExitCode -ne 0) { throw 'Native experience integrity flow failed.' }
          $checks = Get-Content artifacts/ui-experience-integrity-focused/results.txt
          if (@($checks | Where-Object { $_ -like 'PASS *' }).Count -ne 21 -or @($checks | Where-Object { $_ -like 'FAIL *' }).Count -gt 0) { throw 'Native experience integrity checks are incomplete.' }
      - name: Native experience integrity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-experience-integrity
          path: artifacts/ui-experience-integrity-focused/
      - name: Native latest analysis context flow
        shell: pwsh
        run: |
          $root = Join-Path $PWD 'artifacts/ci-analysis-refresh/data'
          $p = Start-Process ./release-next/PerfCompass.exe -ArgumentList @('--ui-test','--ui-test-analysis-refresh-only','--data-dir',('"' + $root + '"')) -PassThru -WindowStyle Hidden
          if (-not $p.WaitForExit(90000)) { throw ('Native analysis refresh observation expired; inspect PID ' + $p.Id) }
          if ($p.ExitCode -ne 0) { throw 'Native analysis refresh flow failed.' }
          $checks = Get-Content artifacts/ui-analysis-refresh-focused/results.txt
          if (@($checks | Where-Object { $_ -like 'PASS *' }).Count -ne 32 -or @($checks | Where-Object { $_ -like 'FAIL *' }).Count -gt 0) { throw 'Native analysis refresh checks are incomplete.' }
      - name: Native analysis refresh evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-analysis-refresh
          path: artifacts/ui-analysis-refresh-focused/
      - name: Native candidate draft preservation and exit flow
        shell: pwsh
        run: |
          $root = Join-Path $PWD 'artifacts/ci-comparison-draft/data'
          $p = Start-Process ./release-next/PerfCompass.exe -ArgumentList @('--ui-test','--ui-test-comparison-draft-only','--data-dir',('"' + $root + '"')) -PassThru -WindowStyle Hidden
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw 'Native candidate draft flow exceeded its bounded check.' }
          if ($p.ExitCode -ne 0) { throw 'Native candidate draft flow failed.' }
          $report = Join-Path $PWD 'artifacts/ui-comparison-draft-focused/results.txt'
          if (-not (Test-Path -LiteralPath $report)) { throw 'Candidate draft results are missing.' }
          $checks = Get-Content -LiteralPath $report
          if (@($checks | Where-Object { $_ -like 'PASS *' }).Count -ne 38 -or @($checks | Where-Object { $_ -like 'FAIL *' }).Count -gt 0) { throw 'Candidate draft checks are incomplete.' }
          $expected = Get-Content artifacts/ui-comparison-draft-focused/expected-exit-draft.json -Raw | ConvertFrom-Json
          $saved = Get-Content (Join-Path $root 'comparison.json') -Raw | ConvertFrom-Json
          if ($saved.Candidates[0].Name -ne $expected.Name -or $saved.Candidates[0].PriceCny -ne $expected.PriceCny) { throw 'Actual final exit did not save the last uncommitted editor.' }
      - name: Native candidate draft evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-candidate-draft
          path: artifacts/ui-comparison-draft-focused/
      - name: Record Windows telemetry reference pairs
        shell: pwsh
        run: |
          $root = Join-Path $PWD 'artifacts/ci-telemetry/data'
          $p = Start-Process ./release-next/PerfCompass.exe -ArgumentList @('--telemetry-check','--validation-seconds','10','--data-dir',('"' + $root + '"')) -PassThru -WindowStyle Hidden
          if (-not $p.WaitForExit(45000)) { $p.Kill(); throw 'Telemetry recording exceeded its bounded check.' }
          if ($p.ExitCode -notin @(0,2)) { throw 'Telemetry recorder failed.' }
          $report = Join-Path $root 'validation/telemetry-cross-check.json'
          if (-not (Test-Path -LiteralPath $report)) { throw 'Telemetry recording report is missing.' }
          $data = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if ($data.Rows.Count -lt 2) { throw 'Telemetry recording has too few observation rows.' }
          Write-Output ('Comparable CPU pairs: ' + $data.CpuPercentagePoints.Pairs + '; exit code: ' + $p.ExitCode)
      - name: Windows telemetry reference recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-telemetry-reference
          path: artifacts/ci-telemetry/data/validation/telemetry-cross-check.json
      - name: NLP diagnostic baseline
        shell: pwsh
        run: |
          $process = Start-Process ./release-next/PerfCompass.exe -ArgumentList '--nlp-evaluate' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw 'NLP diagnostic runner failed' }
      - name: NLP diagnostic results
        uses: actions/upload-artifact@v4
        with:
          name: nlp-diagnostic-baseline
          path: artifacts/nlp-evaluation.*
      - name: Portable Windows x64 application
        uses: actions/upload-artifact@v4
        with:
          name: PerfCompass-Windows-x64
          path: release-next/
